server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API 反代到 BFF（同源，避免 CORS / 混合内容 / 跨域 Cookie 问题）
  # P9 面试点：为什么生产环境不让前端直接打 BFF 的公网域名？
  #   同源反代后浏览器认为一切都在一个域下 → 不需要 CORS 预检、
  #   Cookie 天然同站、也便于在网关层统一做限流和审计
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA fallback：所有未匹配静态文件的请求都交给 index.html
  # P9 面试点：为什么这对 SPA 重要？
  # —— 用户直接访问 /questions/123 会发 HTTP 请求到服务器，
  #    如果没有 try_files，nginx 会返回 404，而 Vue Router 的 history 模式无法接管
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源强缓存（文件名带 hash）
  location ~* \.(?:js|css|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # 安全头
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  # 直接复用 vite-plugin-compression 生成的 .gz，避免每个请求现算
  gzip_static on;
  gzip_vary on;
}
